[project]
name = "aisecurity4fintech"
version = "0.1.0"
description = "AI security platform for fintech workloads"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.0",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
  "uvicorn>=0.30",
]

[tool.uv.workspace]
members = [
  "services/audit-log",
  "services/pii-proxy",
  "services/auth-service",
  "apps/agentflow",
  "apps/vaultrag",
  "packages/py-shared",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["agentflow", "audit_log", "auth", "pii_proxy", "shared", "vaultrag"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = [
  "services/audit-log/src",
  "services/pii-proxy/src",
  "packages/py-shared/src",
  "services/auth-service/src",
  "apps/agentflow/src",
]
addopts = "-ra"
