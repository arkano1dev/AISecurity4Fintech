[project]
name = "auth-service"
version = "0.1.0"
description = "Shared JWT issuer and verifier for the fintech AI platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.7.0",
  "pyjwt[crypto]>=2.10.0",
  "pyyaml>=6.0.0",
  "cryptography>=42.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra"
