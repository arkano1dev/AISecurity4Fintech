[project]
name = "audit-log"
version = "0.1.0"
description = "Append-only audit log service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.9.0",
  "sqlalchemy>=2.0.0",
  "asyncpg>=0.29.0",
  "httpx>=0.27.0",
  "alembic>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
