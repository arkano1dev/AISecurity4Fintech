name: ci

# Pipeline: test, lint, secrets scan, dependency audit, API contract check.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv venv
      - run: uv pip install -e services/audit-log -e services/pii-proxy -e services/auth-service -e apps/agentflow -e apps/vaultrag -e packages/py-shared
      - run: uv pip install pytest pytest-cov pytest-asyncio hypothesis
      - run: uv run pytest -q --cov=services --cov=apps --cov=packages --cov-report=term-missing --cov-fail-under=80

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv venv
      - run: uv pip install -e services/audit-log -e services/pii-proxy -e services/auth-service -e apps/agentflow -e apps/vaultrag -e packages/py-shared
      - run: uv pip install ruff mypy types-PyYAML
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/src" zricethezav/gitleaks:v8.18.4 detect --source /src --no-banner --redact --config /src/.gitleaks.toml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv venv
      - run: uv pip install -e services/audit-log -e services/pii-proxy -e services/auth-service -e apps/agentflow -e apps/vaultrag -e packages/py-shared
      - run: uv pip install pip-audit
      - run: uv run pip-audit

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv venv
      - run: uv pip install -e services/audit-log -e services/pii-proxy -e services/auth-service -e apps/agentflow -e apps/vaultrag -e packages/py-shared
      - run: uv run python scripts/check_contract.py
