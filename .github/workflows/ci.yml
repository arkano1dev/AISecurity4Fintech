name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip ruff mypy
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest pytest-cov
      - run: pytest services/audit-log -q --cov=services/audit-log/src --cov-fail-under=0

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/src" zricethezav/gitleaks:v8.18.4 detect --source /src --no-banner --redact --config /src/.gitleaks.toml

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python - <<'PY'
          import pathlib
          root = pathlib.Path('.')
          assert (root / 'services' / 'audit-log' / 'src' / 'audit_log').exists()
          print('contract validation stub ok')
        PY

  security:
    runs-on: ubuntu-latest
    steps:
      - run: echo "red-team suite not wired yet (W5)"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose/docker-compose.dev.yml config >/dev/null
