[project]
name = "agentflow"
version = "0.1.0"
description = "Multi-agent customer support orchestrator for the fintech platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.7.0",
  "httpx>=0.27.0",
  "pyjwt[crypto]>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
