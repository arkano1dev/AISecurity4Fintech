[project]
name = "py-shared"
version = "0.1.0"
description = "Shared Python helpers for the fintech platform"
requires-python = ">=3.12"
dependencies = [
  "pydantic-settings>=2.3.0",
  "opentelemetry-api>=1.27.0",
  "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
